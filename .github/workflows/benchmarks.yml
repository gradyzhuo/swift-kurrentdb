# Runs the offline benchmarks (Benchmarks/OfflineBenchmarks) on Linux.
#
# Results are not committed automatically: GitHub-hosted runners do not
# guarantee identical hardware between runs, so numbers are reviewed by a
# person before they land in BENCHMARKS.md. Each run publishes the full
# markdown report to the job summary and as a downloadable artifact.
name: Benchmarks
on:
  workflow_dispatch:
  push:
    # TEMPORARY: verify the Bencher upload before it lands on main; remove before merge.
    branches: [ "main", "feat/linux-benchmarks-workflow" ]

jobs:
  offline-benchmarks:
    name: Offline benchmarks / Swift ${{ matrix.swift }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        swift: ["6.4"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Package.swift only declares the benchmark target on Linux when this is set.
      KURRENTDB_BENCHMARKS: "1"
      # Bencher project that keeps the history: https://bencher.dev/perf/gradyzhuo-s-project
      BENCHER_PROJECT: gradyzhuo-s-project
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}

      - name: Install jemalloc
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev

      - name: Describe runner
        # The numbers below are what BENCHMARKS.md's "Environment" table needs.
        run: |
          {
            echo "## Environment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Runner** | ${{ matrix.os }} (${{ runner.arch }}) |"
            echo "| **CPU** | $(lscpu | awk -F': *' '/Model name/ {print $2; exit}') |"
            echo "| **Cores** | $(nproc) |"
            echo "| **Memory** | $(awk '/MemTotal/ {printf "%.0f GB", $2/1024/1024}' /proc/meminfo) |"
            echo "| **OS** | $(lsb_release -ds) ($(uname -r)) |"
            echo "| **Swift** | $(swift --version 2>&1 | head -n 1) |"
            echo "| **Build** | Release |"
            echo
          } | tee environment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run offline benchmarks
        run: |
          swift package --disable-sandbox benchmark \
            --target OfflineBenchmarks \
            --format markdown \
            --no-progress \
            | tee results.md
          cat results.md >> "$GITHUB_STEP_SUMMARY"

      # A second pass in JMH format: it carries every percentile of every metric,
      # which scripts/bench_to_bmf.py turns into Bencher Metric Format.
      - name: Export benchmark percentiles
        run: |
          mkdir -p bench-out
          swift package --disable-sandbox benchmark \
            --target OfflineBenchmarks \
            --format jmh \
            --path bench-out \
            --no-progress
          python3 scripts/bench_to_bmf.py bench-out/Current_run.jmh.json > bmf.json
          python3 -c 'import json; d=json.load(open("bmf.json")); print(len(d), "benchmarks converted")'

      - uses: bencherdev/bencher@main

      # Uploads to Bencher; the perf page (see BENCHER_PROJECT) keeps the history per commit.
      # On main a t-test threshold flags a run whose latency falls outside the 99% band of
      # the last 64 runs, and --error-on-alert turns that alert into a failed job. Other branches
      # (manual runs) are uploaded without thresholds so they never fail on noise.
      - name: Upload to Bencher
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
        run: |
          threshold_args=()
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            threshold_args=(
              --threshold-measure latency
              --threshold-test t_test
              --threshold-max-sample-size 64
              --threshold-upper-boundary 0.99
              --thresholds-reset
              --error-on-alert
            )
          fi
          bencher run \
            --project "$BENCHER_PROJECT" \
            --branch "${GITHUB_REF_NAME}" \
            --hash "${GITHUB_SHA}" \
            --testbed "${{ matrix.os }}" \
            --adapter json \
            --file bmf.json \
            "${threshold_args[@]}" \
            --github-actions "${{ secrets.GITHUB_TOKEN }}"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: offline-benchmarks-swift-${{ matrix.swift }}-${{ matrix.os }}
          path: |
            environment.md
            results.md
            bmf.json
          if-no-files-found: error
