# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift-build-testing
on:
  push:
    branches: [ "main" ]
  pull_request:

# Least privilege for every job: read the repository, nothing else. The repository default is
# already read-only; stating it here keeps the workflow safe if that default ever changes.
# Third-party actions are pinned to full commit SHAs (version in the trailing comment) so an
# upstream tag or branch that moves cannot run new code with this repository's secrets.
permissions:
  contents: read

jobs:
  # Full integration test suite (Ubuntu + KurrentDB cluster)
  build:
    name: Swift ${{ matrix.swift }} / KurrentDB ${{ matrix.kurrentdb.version }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to 26.04 on 2026-10-26, and swift.org builds the 6.0–6.3
        # toolchains for 24.04 only (they need libxml2.so.2, which 26.04 no longer ships).
        os: [ubuntu-24.04]
        swift: ["6.0", "6.1", "6.2", "6.3", "6.4"]
        kurrentdb:
          # Images come from Kurrent's official Docker Hub namespace, whose minor tags track the latest patch release
          # (docker.kurrent.io lagged behind, e.g. 26.1 -> 26.1.1 while 26.1.3 was out, and had no x64 26.2). The 24.10
          # EventStoreDB EE image exists only on docker.kurrent.io.
          - { version: "24.10",  image: "docker.kurrent.io/eventstore/eventstoredb-ee:24.10", compose_file: "server/docker-compose.eventstore.yaml", supports_multi_streams: "false", supports_append_records: "false" }
          - { version: "25.1",   image: "docker.io/kurrentplatform/kurrentdb:25.1",           compose_file: "server/docker-compose.yaml",             supports_multi_streams: "true",  supports_append_records: "false" }
          - { version: "26.0",   image: "docker.io/kurrentplatform/kurrentdb:26.0",           compose_file: "server/docker-compose.yaml",             supports_multi_streams: "true",  supports_append_records: "false" }
          - { version: "26.1",   image: "docker.io/kurrentplatform/kurrentdb:26.1",           compose_file: "server/docker-compose.yaml",             supports_multi_streams: "true",  supports_append_records: "true"  }
          # 26.2+ shuts down an unlicensed multi-node cluster ("A license is required to use the Multi-Node Cluster
          # feature"), so 26.2 runs as one TLS node published on 2111-2113 (server/docker-compose.single.yaml). 26.2
          # also rejects creating transient projections ("Transient projections are deprecated").
          - { version: "26.2",   image: "docker.io/kurrentplatform/kurrentdb:26.2",           compose_file: "server/docker-compose.single.yaml",      supports_multi_streams: "true",  supports_append_records: "true", supports_transient_projections: "false" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      KURRENTDB_SUPPORTS_MULTI_STREAMS: ${{ matrix.kurrentdb.supports_multi_streams }}
      KURRENTDB_SUPPORTS_APPEND_RECORDS: ${{ matrix.kurrentdb.supports_append_records }}
      # Unset on every row but 26.2, so the transient projection test runs everywhere else.
      KURRENTDB_SUPPORTS_TRANSIENT_PROJECTIONS: ${{ matrix.kurrentdb.supports_transient_projections }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1 (was @latest, same commit)
        with:
           swift-version: ${{ matrix.swift }}
      - run: ulimit -n 10000

      - name: Start KurrentDB cluster
        run: KURRENTDB_IMAGE=${{ matrix.kurrentdb.image }} docker compose -f ${{ matrix.kurrentdb.compose_file }} up -d

      - name: Wait for cluster to be healthy
        run: |
          echo "Waiting for KurrentDB cluster to be healthy..."
          for i in $(seq 1 60); do
            if curl --fail --insecure https://127.0.0.1:2111/health/live 2>/dev/null && \
               curl --fail --insecure https://127.0.0.1:2112/health/live 2>/dev/null && \
               curl --fail --insecure https://127.0.0.1:2113/health/live 2>/dev/null; then
              echo "All nodes are healthy!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 5s..."
            sleep 5
          done
          echo "Cluster failed to become healthy"
          docker compose -f ${{ matrix.kurrentdb.compose_file }} logs
          exit 1

      - name: Copy generated CA certificate to test resources
        run: |
          docker cp setup:/certs/ca/ca.crt /tmp/ca.crt
          for dir in Tests/*/Resources; do
            cp /tmp/ca.crt "$dir/ca.crt"
          done

      # Every Swift example in the docs becomes part of the DocSnippetsTests
      # target, so the build below fails if an example no longer compiles.
      - name: Generate documentation snippets
        run: python3 scripts/generate-doc-snippets.py

      - name: Build
        run: swift build --build-tests --enable-code-coverage
      # stdbuf -oL: the test runner's stdout is a pipe here and gets block-buffered, so a hung
      # step is killed with every line still in the buffer — the log then shows nothing past
      # "Planning build". Line buffering keeps the output as far as the hang.
      - name: Swift Testing
        run: stdbuf -oL swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter "StreamsTests|ProjectionsTests|PersistentSubscriptionsTests|UsersTests|MonitoringTests|GossipTests|KurrentCoreTests|MockClientTests|KurrentDBPoolTests"
      # OperationsTests drive admin RPCs (scavenge, resign node, restart the persistent
      # subscriptions subsystem) that briefly disturb the cluster, so they run on their own
      # after the main suites instead of interleaved with them.
      - name: Swift Testing (Operations)
        run: stdbuf -oL swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter OperationsTests
      # Server-side view of a failed run: leader elections, dropped connections and the like
      # never show up in the Swift test output.
      - name: Dump cluster logs
        if: failure() || cancelled()
        run: docker compose -f ${{ matrix.kurrentdb.compose_file }} logs --tail 200
      - uses: sersoft-gmbh/swift-coverage-action@33c46a78bc78e0746a3d9fe2f5372a47736399b4 # v4.0.0
        id: coverage-files
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ join(fromJSON(steps.coverage-files.outputs.files), ',') }}

  # KurrentDBPool's live suite needs genuinely independent (non-clustered)
  # KurrentDB instances, unlike the `build` job's gossip cluster above — a
  # pool member is supposed to be its own unrelated database, not a replica.
  # Each instance sets KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS to its own
  # mapped host port: without it, every instance's gossip response reports
  # the same internal container port (2113), and the client's node discovery
  # collapses all of them onto that one (wrong) address.
  kurrentdb-pool-live-tests:
    name: KurrentDBPool live suite
    runs-on: ubuntu-24.04  # setup-swift toolchain, see the test matrix
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1 (was @latest, same commit)
        with:
          swift-version: "6.2"

      - name: Start two independent KurrentDB instances
        run: |
          for port in 2114 2115; do
            docker run --rm -d --name "kurrentdb-pool-$port" -p 127.0.0.1:${port}:2113 \
              -e KURRENTDB_CLUSTER_SIZE=1 \
              -e KURRENTDB_RUN_PROJECTIONS=All \
              -e KURRENTDB_START_STANDARD_PROJECTIONS=true \
              -e KURRENTDB_INSECURE=true \
              -e KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true \
              -e KURRENTDB_ADVERTISE_NODE_PORT_TO_CLIENT_AS=${port} \
              docker.io/kurrentplatform/kurrentdb:25.1
          done

      - name: Wait for both instances to be healthy
        run: |
          for port in 2114 2115; do
            echo "Waiting for instance on port $port..."
            healthy=false
            for i in $(seq 1 30); do
              if curl --fail http://127.0.0.1:${port}/gossip >/dev/null 2>&1; then
                echo "port $port healthy"
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != "true" ]; then
              echo "instance on port $port failed to become healthy"
              docker logs "kurrentdb-pool-${port}"
              exit 1
            fi
          done

      - name: Build
        run: swift build --build-tests

      - name: Swift Testing
        env:
          KURRENTDB_POOL_URLS: '["esdb://admin:changeit@localhost:2114?tls=false","esdb://admin:changeit@localhost:2115?tls=false"]'
        run: swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter "KurrentDBPoolTests"

  # X.509 user certificate authentication against a live node. KurrentDB 26.2+ accepts user
  # certificates without a license (older servers treat them as a licensed feature), so this job
  # runs on every push and pull request against a single unlicensed 26.2 node.
  x509-live-tests:
    name: X.509 user certificates
    runs-on: ubuntu-24.04  # setup-swift toolchain, see the test matrix
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: SwiftyLab/setup-swift@9014d4136569075c696d4151c7810ecde8712907 # v1.14.1 (was @latest, same commit)
        with:
          swift-version: "6.2"

      - name: Start KurrentDB with user certificates
        run: KURRENTDB_IMAGE=docker.io/kurrentplatform/kurrentdb:26.2 CERTS_DIR="$RUNNER_TEMP/x509-certs" KURRENTDB_X509_PORT=2116 server/x509/start.sh

      - name: Build
        run: swift build --build-tests

      - name: Swift Testing
        env:
          KURRENTDB_X509_CERTS_DIR: ${{ runner.temp }}/x509-certs
          KURRENTDB_X509_PORT: "2116"
        run: swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter X509Tests

      - name: Server logs
        if: failure()
        run: docker logs kurrentdb-x509

  # Offline build + MockClientTests on additional Linux distributions.
  # Uses `docker run` instead of the `container:` directive so that
  # actions/checkout@v4 (Node.js 20, requires GLIBC_2.27) runs on the Ubuntu
  # host, while the actual build and tests run inside the target container
  # where the Swift toolchain is pre-installed.
  build-linux-distros:
    name: Build on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - "swift:6.2-amazonlinux2"   # Amazon Linux 2 — primary AWS/Lambda deployment target
          - "swift:6.2-bookworm"       # Debian 12 — stable, covers non-Ubuntu Debian family
          - "swift:6.3-amazonlinux2"   # Amazon Linux 2 — primary AWS/Lambda deployment target
          - "swift:6.3-bookworm"       # Debian 12 — stable, covers non-Ubuntu Debian family
          # Swift 6.4 dropped Amazon Linux 2 images (AL2 is EOL); use AL2023 instead.
          - "swift:6.4-amazonlinux2023" # Amazon Linux 2023 — AWS/Lambda deployment target
          - "swift:6.4-bookworm"       # Debian 12 — stable, covers non-Ubuntu Debian family
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build and Offline Tests (MockClientTests)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.image }} \
            bash -c "swift build --build-tests && swift test -v --no-parallel --disable-xctest --enable-swift-testing --filter MockClientTests"
