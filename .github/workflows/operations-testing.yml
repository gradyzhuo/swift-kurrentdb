# Operations tests run in a separate workflow because scavenge, merge-indexes, and
# restart-persistent-subscriptions mutate cluster-level state and can interfere
# with other test suites when run concurrently.

name: Operations-testing
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  operations:
    name: OperationsTests / Swift ${{ matrix.swift }} / KurrentDB ${{ matrix.kurrentdb.version }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        swift: ["6.0", "6.1", "6.2"]
        kurrentdb:
          - { version: "24.10",  image: "docker.eventstore.com/eventstore/eventstoredb-ee:24.10", compose_file: "server/docker-compose.eventstore.yaml" }
          - { version: "25.1",   image: "docker.kurrent.io/kurrent-latest/kurrentdb:25.1",            compose_file: "server/docker-compose.yaml" }
          - { version: "26.0",   image: "docker.kurrent.io/kurrent-latest/kurrentdb:26.0",            compose_file: "server/docker-compose.yaml" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - run: ulimit -n 10000

      - name: Start KurrentDB cluster
        run: KURRENTDB_IMAGE=${{ matrix.kurrentdb.image }} docker compose -f ${{ matrix.kurrentdb.compose_file }} up -d

      - name: Wait for cluster to be healthy
        run: |
          echo "Waiting for KurrentDB cluster to be healthy..."
          for i in $(seq 1 60); do
            if curl --fail --insecure https://127.0.0.1:2111/health/live 2>/dev/null && \
               curl --fail --insecure https://127.0.0.1:2112/health/live 2>/dev/null && \
               curl --fail --insecure https://127.0.0.1:2113/health/live 2>/dev/null; then
              echo "All nodes are healthy!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 5s..."
            sleep 5
          done
          echo "Cluster failed to become healthy"
          docker compose -f ${{ matrix.kurrentdb.compose_file }} logs
          exit 1

      - name: Copy generated CA certificate to test resources
        run: |
          docker cp setup:/certs/ca/ca.crt /tmp/ca.crt
          for dir in Tests/*/Resources; do
            cp /tmp/ca.crt "$dir/ca.crt"
          done

      - name: Build
        run: swift build --build-tests
      - name: Swift Testing (OperationsTests only)
        run: swift test -v --skip-build --no-parallel --disable-xctest --enable-swift-testing --filter OperationsTests
