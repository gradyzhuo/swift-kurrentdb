# Builds the KurrentDB DocC documentation for every published version and deploys it to
# GitHub Pages together with the landing page in docs/:
#
#   https://gradyzhuo.github.io/swift-kurrentdb/                                 ← docs/index.html
#   https://gradyzhuo.github.io/swift-kurrentdb/documentation/kurrentdb/         ← latest release
#   https://gradyzhuo.github.io/swift-kurrentdb/<major.minor>/documentation/kurrentdb/
#   https://gradyzhuo.github.io/swift-kurrentdb/main/documentation/kurrentdb/
#
# The published releases are the latest patch of every minor (`doc-versions` in scripts/), and
# docs/doc-versions.js adds a version menu to every page. GitHub Pages must use "GitHub
# Actions" as its source, and the github-pages environment must allow `*.*.*` tags so that
# a release deploys as soon as it is tagged.
#
# The DocC is built without swift-docc-plugin, so the package gains no dependency: the
# compiler emits the symbol graph and the toolchain's own `docc` converts it. Only
# KurrentDB.symbols.json is used, which leaves out extensions on other modules — the same
# result as `--exclude-extended-types` on Swift Package Index.
#
# Compiling a symbol graph takes minutes, converting it takes about a second. Each release's
# symbol graph is therefore kept in the Actions cache (keyed by commit and toolchain) and
# only main is compiled on every run; an evicted entry is simply rebuilt.
#
# Pull requests only build the site; pushes to main, release tags and manual runs deploy it,
# except the Prepare commit of a release, whose deploy is left to the release tag (see deploy).
name: Documentation
on:
  push:
    branches: [ "main" ]
    tags: [ "*.*.*" ]
  pull_request:
  workflow_dispatch:

# Least privilege: the deploy job asks for the Pages permissions it needs.
permissions:
  contents: read

jobs:
  versions:
    name: List versions
    runs-on: ubuntu-latest
    container: swift:6.4-bookworm  # for the scripts package
    outputs:
      releases: ${{ steps.list.outputs.releases }}
      matrix: ${{ steps.list.outputs.matrix }}
      prepare: ${{ steps.prepare.outputs.prepare }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # A release tag locks the catalog and README into /X.Y/ and the site root for good, so a
      # tag whose documentation is not ready fails here instead of publishing a stale "latest".
      - name: Release readiness
        if: github.ref_type == 'tag'
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            swift run --package-path scripts check-release-readiness "$GITHUB_REF_NAME"
          else
            echo "$GITHUB_REF_NAME is not a release tag; nothing to check"
          fi

      - id: list
        env:
          # A tag's run documents the main branch as "main", not the tagged commit.
          MAIN_REF: ${{ github.ref_type == 'tag' && 'main' || github.sha }}
        run: |
          releases=$(swift run --package-path scripts doc-versions)
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "matrix=$(swift run --package-path scripts doc-versions --main "$MAIN_REF")" >> "$GITHUB_OUTPUT"

      # The deploy job leaves the Prepare commit (`[UPDATE] prepare X.Y.Z: …`) to the release
      # tag. A rebase or squash merge makes it main's head; a merge commit makes it the merged
      # branch's tip, the second parent, so both are looked at.
      - id: prepare
        run: |
          is_prepare() {
            git rev-parse -q --verify "$1^{commit}" > /dev/null \
              && [[ "$(git log -1 --format=%s "$1")" == '[UPDATE] prepare '* ]]
          }
          if is_prepare HEAD || is_prepare HEAD^2; then prepare=true; else prepare=false; fi
          echo "prepare=$prepare" >> "$GITHUB_OUTPUT"

  symbol-graph:
    name: Symbol graph (${{ matrix.label }})
    needs: versions
    runs-on: ubuntu-latest
    container: swift:6.4-bookworm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.ref }}

      - id: cache
        if: matrix.label != 'main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: symbol-graph
          # Keep the toolchain in the key in sync with `container:`, so a new toolchain rebuilds every release.
          key: docc-symbol-graph-swift-6.4-bookworm-${{ matrix.commit }}

      - name: Emit the KurrentDB symbol graph
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          swift build --target KurrentDB \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir -Xswiftc "$RUNNER_TEMP/symbol-graphs"
          mkdir -p symbol-graph
          cp "$RUNNER_TEMP/symbol-graphs/KurrentDB.symbols.json" symbol-graph/

      - name: Collect the symbol graph and the catalog
        run: |
          mkdir doc-input
          cp symbol-graph/KurrentDB.symbols.json doc-input/
          cp -R Sources/KurrentDB/KurrentDB.docc doc-input/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-input-${{ matrix.label }}
          path: doc-input
          retention-days: 1

  site:
    name: Build site
    needs: [versions, symbol-graph]
    runs-on: ubuntu-latest
    container: swift:6.4-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: doc-input-*
          path: doc-input

      - name: Assemble the site
        env:
          RELEASES: ${{ needs.versions.outputs.releases }}
        run: |
          # Each artifact downloads into doc-input/doc-input-<label>; the tool expects doc-input/<label>.
          for artifact in doc-input/doc-input-*; do
            mv "$artifact" "doc-input/${artifact#doc-input/doc-input-}"
          done
          swift run --package-path scripts build-docs-site --inputs doc-input --releases "$RELEASES" --output _site
          test -f _site/documentation/kurrentdb/index.html
          test -f _site/main/documentation/kurrentdb/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    # Pages keys deployments by commit SHA and ignores a second deploy of a SHA it already
    # serves, so a release tag on the commit main just deployed never reached the site. The
    # Prepare commit (`[UPDATE] prepare X.Y.Z: …`, the last one merged before the owner tags
    # it; the `prepare` step of the versions job finds it whichever way it was merged)
    # therefore skips the deploy from main: the tag's run is the first deploy of that SHA.
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      && !(github.ref == 'refs/heads/main' && needs.versions.outputs.prepare == 'true')
    needs: [versions, site]
    runs-on: ubuntu-latest
    # Deployments from main and from tags take turns; a newer one replaces a queued one.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}documentation/kurrentdb/
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
